version: '3.8'

services:
  jenkins:
    image: jenkins/jenkins:lts
    container_name: jenkins
    user: root  # Required to access the mounted docker.sock
    privileged: true
    ports:
      - "8080:8080"
      - "50000:50000"
    volumes:
      # Persists Jenkins data (plugins, jobs, etc.)
      - jenkins_home:/var/jenkins_home
      # Mounts the host Docker socket so Jenkins can run 'docker' commands
      - /var/run/docker.sock:/var/run/docker.sock
      # Optional: Mounts the host docker binary if it's not in the image
      - /usr/bin/docker:/usr/bin/docker
    restart: unless-stopped

volumes:
  jenkins_home:
